      paya:
        domains:
        - payment-network-shared
        status: consistent
        confidence: 0.95
        alternatives:
          payment-network-shared: 5
        observations:
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/deployment-domains.yaml
          field: services.paya.labels.emac.dev/effective-payment-domain
          signal: mesh service label
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/deployment-domains.yaml
          field: services.paya.provider.network
          signal: provider metadata
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/trace-evidence.yaml
          field: spans.d1-paya.attributes.emac.provider_domain
          signal: trace payment-domain attribute
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/trace-evidence.yaml
          field: spans.d2-paya.attributes.emac.provider_domain
          signal: trace payment-domain attribute
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/trace-evidence.yaml
          field: spans.d3-paya.attributes.emac.provider_domain
          signal: trace payment-domain attribute
      payb:
        domains:
        - payment-network-shared
        status: consistent
        confidence: 0.95
        alternatives:
          payment-network-shared: 5
        observations:
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/deployment-domains.yaml
          field: services.payb.labels.emac.dev/effective-payment-domain
          signal: mesh service label
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/deployment-domains.yaml
          field: services.payb.provider.network
          signal: provider metadata
        - value: payment-network-shared
          file: fixtures/evidence/payment_shared_fate_drift/trace-evidence.yaml
