apiVersion: emac.sanity/v1
kind: SanityDerivationReport
metadata:
  name: checkout-payment_shared_fate_drift
  labels:
    emac.example: 'true'
    emac.sanity.generated: 'true'
    journey: checkout
    scenario: payment_shared_fate_drift
spec:
  scenario: payment_shared_fate_drift
  inputArtifacts:
    canonicalIntent: ../spec/emac.checkout.yaml
    acceptedModel: fixtures/accepted/baseline.accepted-model.yaml
    atomicSloInput: fixtures/atomic/checkout-atomic-availability.yaml
    policy: fixtures/policy/sanity-policy.yaml
    scenario: fixtures/evidence/payment_shared_fate_drift/scenario.yaml
    traceEvidence: fixtures/evidence/payment_shared_fate_drift/trace-evidence.yaml
    deploymentDomainEvidence: fixtures/evidence/payment_shared_fate_drift/deployment-domains.yaml
  generatedArtifacts:
    discoveredModel: generated/models/payment_shared_fate_drift.discovered-model.yaml
    delta: generated/deltas/payment_shared_fate_drift.delta.yaml
  operatorGraph: Series(front, Parallel(cart, pricing), Race(paya, payb))
  atomicAvailabilityInputs:
    front: 0.9995
    cart: 0.999
    pricing: 0.999
    paya: 0.995
    payb: 0.995
  localSloView: unchanged/green
  policy:
    objectiveAvailability: 0.995
    evidenceWindow: 30d
    autoAcceptConfidence: 0.8
    highImpactDeltaThreshold: 0.001
  failureDomainAssumptions:
    paymentRaceRelation: shared_effective_domain
    paymentDomains:
      paya:
      - payment-network-shared
      payb:
      - payment-network-shared
    pessimisticRule: 'sharedEffectiveDomain: collapse race to best single alternative'
    assumptions:
    - paya and payb share one effective payment domain
    - full correlation inside that domain removes race availability gain
  composition:
    formulas:
      series: multiply required stages
      parallelJoinAll: multiply all branches
      raceOptimistic: 1 - (1 - A_paya) * (1 - A_payb)
      racePessimisticShared: max(A_paya, A_payb)
    optimisticEstimate:
      symbol: A_plus
      value: 0.99747706
      paymentRaceRule: 1 - (1 - A_paya) * (1 - A_payb)
    pessimisticBound:
      symbol: A_minus
      value: 0.99251449
      paymentRaceRule: 'sharedEffectiveDomain: collapse race to best single alternative'
    boundWidth: 0.00496257
    intermediateValues:
      parallelCartPricing: 0.998001
      raceOptimistic: 0.999975
      racePessimistic: 0.995
  confidence:
    overall: 0.95
    fields:
      operatorEdges: 0.95
      paymentRace: 0.95
      failureDomains: 0.95
    evidenceFlags: []
    basis:
    - operator edges use trace parent/child span linkage
    - payment race uses overlapping payment alternatives plus accepted intent
    - failure domains use deployment/provider labels and payment span attributes
  governance:
    decision: FAIL
    reasons:
    - A_minus 0.99251449 is below objective 0.99500000
    passRequires:
    - A_minus >= objectiveAvailability
    - overallConfidence >= autoAcceptConfidence
    - no unresolved high-impact model delta
    - no incomplete or conflicting evidence flags
  dominantContributors:
  - name: payment_race_domain_correlation
    reason: payment race redundancy is removed or not trusted in the pessimistic bound
    raceAPlus: 0.999975
    raceAMinus: 0.995
    paymentRaceLoss: 0.004975
  - name: objective_violation
    reason: A_minus is below the policy objective
    objectiveAvailability: 0.995
    shortfall: 0.00248551
  interpretation: Local SLO inputs are unchanged, but evidence moves paya and payb into one effective
    payment domain. A_plus stays the same while A_minus collapses the payment race and the conservative
    gate returns FAIL.
