apiVersion: emac.sanity/v1
kind: SanityDerivationReport
metadata:
  name: checkout-baseline_separate_domains
  labels:
    emac.example: 'true'
    emac.sanity.generated: 'true'
    journey: checkout
    scenario: baseline_separate_domains
spec:
  scenario: baseline_separate_domains
  inputArtifacts:
    canonicalIntent: ../../examples/checkout/spec/emac.checkout.yaml
    acceptedModel: fixtures/accepted/baseline.accepted-model.yaml
    atomicSloInput: fixtures/atomic/checkout-atomic-availability.yaml
    policy: fixtures/policy/sanity-policy.yaml
    scenario: fixtures/evidence/baseline_separate_domains/scenario.yaml
    traceEvidence: fixtures/evidence/baseline_separate_domains/trace-evidence.yaml
    deploymentDomainEvidence: fixtures/evidence/baseline_separate_domains/deployment-domains.yaml
  generatedArtifacts:
    discoveredModel: generated/models/baseline_separate_domains.discovered-model.yaml
    delta: null
  operatorGraph: Series(front, Parallel(cart, pricing), Race(paya, payb))
  atomicAvailabilityInputs:
    front: 0.9995
    cart: 0.999
    pricing: 0.999
    paya: 0.995
    payb: 0.995
  localSloView: unchanged/green
  policy:
    objectiveAvailability: 0.995
    evidenceWindow: 30d
    autoAcceptConfidence: 0.8
    highImpactDeltaThreshold: 0.001
  failureDomainAssumptions:
    paymentRaceRelation: separate_effective_domains
    paymentDomains:
      paya:
      - payment-network-a
      payb:
      - payment-network-b
    pessimisticRule: 'separateKnownDomains: use independent race formula'
    assumptions:
    - paya and payb have distinct known effective payment domains
    - payment race keeps independent redundancy in the pessimistic replay bound
  composition:
    formulas:
      series: multiply required stages
      parallelJoinAll: multiply all branches
      raceOptimistic: 1 - (1 - A_paya) * (1 - A_payb)
      racePessimisticShared: max(A_paya, A_payb)
    optimisticEstimate:
      symbol: A_plus
      value: 0.99747706
      paymentRaceRule: 1 - (1 - A_paya) * (1 - A_payb)
    pessimisticBound:
      symbol: A_minus
      value: 0.99747706
      paymentRaceRule: 'separateKnownDomains: use independent race formula'
    boundWidth: 0.0
    intermediateValues:
      parallelCartPricing: 0.998001
      raceOptimistic: 0.999975
      racePessimistic: 0.999975
  confidence:
    overall: 0.95
    fields:
      operatorEdges: 0.95
      paymentRace: 0.95
      failureDomains: 0.95
    evidenceFlags: []
    basis:
    - operator edges use trace parent/child span linkage
    - payment race uses overlapping payment alternatives plus accepted intent
    - failure domains use deployment/provider labels and payment span attributes
  governance:
    decision: PASS
    reasons:
    - A_minus meets objective and evidence confidence is sufficient
    passRequires:
    - A_minus >= objectiveAvailability
    - overallConfidence >= autoAcceptConfidence
    - no unresolved high-impact model delta
    - no incomplete or conflicting evidence flags
  dominantContributors: []
  interpretation: Evidence supports separate effective payment domains, so the pessimistic replay keeps
    the payment race redundancy and the conservative gate passes.
